<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're booked · Brixen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  :root{--ink:#152238;--ink-2:#5e6b78;--line:#d3d7de;--cta:#1d5bd6;--check:#1d7a4c}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font:400 1rem/1.6 "Poppins",system-ui,"Segoe UI",Arial,sans-serif}
  main{max-width:560px;margin:0 auto;padding:48px 20px;text-align:center}
  .logo{height:56px;margin-bottom:18px}
  .tick{width:64px;height:64px;border-radius:50%;background:#e8f5ee;display:grid;place-items:center;margin:0 auto 16px}
  .tick svg{width:32px;height:32px;color:var(--check)}
  h1{font-weight:600;font-size:1.8rem;margin:0 0 8px;letter-spacing:-.02em}
  p{margin:0 0 10px;color:var(--ink-2)}
  ul{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:10px}
  li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  li b{color:var(--cta);font-weight:600;min-width:18px}
  .call{font-size:.95rem}
  .call a{color:var(--ink);font-weight:600}
  .back{display:inline-block;margin-top:14px;color:var(--cta);font-weight:600;text-decoration:none}
  .framed .logo,.framed .back{display:none}
  .framed main{padding:28px 20px}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Brixen Consultancy">
  <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <h1>You're booked.</h1>
  <p>The invite is on its way to your email.</p>
  <ul>
    <li><b>1</b><span>Bring one project, or one job you're bidding.</span></li>
    <li><b>2</b><span>We'll tell you how we'd handle it, what it costs and when you'd have it.</span></li>
    <li><b>3</b><span>10 minutes. No pitch, no contract.</span></li>
  </ul>
  <p class="call">Need to change the time? Call <a href="tel:+17379779817">+1 (737) 977-9817</a></p>
  <a class="back" href="./">← Back to the page</a>
</main>
<script>
  // Inside the landing page's calendar box: tell the page, so it shows its own thank-you.
  if (window.top !== window.self){
    document.documentElement.className = "framed";
    try{ window.parent.postMessage({bx:"booked"}, "*"); }catch(e){}
  }
</script>
</body>
</html>
